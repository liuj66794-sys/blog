name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PR 门禁：合并前跑构建 + 死链校验（deploy job 对 PR 跳过，不部署）
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本以 package.json 的 packageManager 字段为准

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      # 讲义/博客/知识库内容由本地 sync-learn.mjs 同步后提交；
      # 项目墙在 CI 里刷新（获取最新 stars/描述）
      - name: Refresh projects page
        run: node scripts/fetch-projects.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: pnpm docs:build

      # 站内死链校验：生成模板/镜像与产物之间漂移（死链、漏拷、base 拼错）即失败
      - name: Check internal links
        run: node scripts/check-links.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
